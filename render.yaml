services:
  - type: web
    name: medical-voice-assistant-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn render_server:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
